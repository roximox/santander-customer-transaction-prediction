[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santander-customer-transaction-prediction"
version = "0.1.0"
description = "Reproducible Advanced Data Analytics project scaffold."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "integration: tests that require network access or external services",
]
